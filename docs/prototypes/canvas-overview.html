<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾途 · 500 张画布总览样例</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#363c35;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #b77542;outline-offset:4px}header{height:82px;border-bottom:1px solid #dedfd6;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:#faf9f5}h1{font:600 23px Georgia,serif;letter-spacing:2px;margin:0}small{color:#7c8275;font-size:12px}.badge{background:#e7ebdf;color:#58634b;padding:8px 14px;border-radius:20px;font-size:12px}main{max-width:1440px;margin:auto;padding:28px 40px}.heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px}h2{font-size:28px;font-weight:500;margin:0 0 5px}.sub{margin:0;color:#777d70}.toolbar{display:flex;align-items:center;gap:10px;margin:22px 0 18px}button.control{border:1px solid #d8dccf;background:#fafbf7;padding:8px 15px;border-radius:8px}.control.active{background:#53634d;color:white;border-color:#53634d}.spacer{flex:1}.summary{display:flex;gap:24px;color:#747a6d;font-size:12px;margin-bottom:16px}.summary b{color:#46513e;font-size:16px;font-weight:600}.canvas{position:relative;min-height:610px;border:1px solid #dddfd4;border-radius:14px;overflow:hidden;background-color:#eeeee5;background-image:radial-gradient(#b8beaa 1px,transparent 1px);background-size:20px 20px;padding:26px}.canvas-head{display:flex;justify-content:space-between;margin-bottom:20px;color:#7b806e;font-size:12px}.regions{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.region{padding:16px;background:#f8f7f0d9;border:1px solid #dcdfd0;border-radius:10px;box-shadow:0 6px 15px #44513206}.region h3{font-weight:500;font-size:16px;margin:0 0 12px}.cover{display:block;text-align:left;width:100%;padding:0;border:0;background:#fff;border-radius:7px;overflow:hidden;box-shadow:0 3px 8px #434b3312}.cover img{width:100%;height:132px;object-fit:cover;display:block}.cover span{display:block;padding:10px 12px}.cover b{font-weight:500}.cover small{display:block}.clusters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.cluster{border:1px dashed #bdc7b1;background:#e7ecdf;padding:15px 5px;border-radius:8px;transition:transform .15s}.cluster:hover{transform:translateY(-3px);background:#dce5d2}.cluster strong{font-size:25px;display:block;font-weight:500}.cluster span{font-size:11px;display:block;color:#727c66}.legend{display:flex;gap:22px;margin-top:22px;color:#7d836f;font-size:12px}.detail-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}.photo{padding:4px;border:1px solid #d9ddcf;border-radius:5px;background:#fff;text-align:left}.photo[aria-pressed=true]{outline:2px solid #738661;background:#ecf1e6}.photo img{width:100%;height:100px;display:block;object-fit:cover}.photo span{display:block;font-size:11px;padding:4px;color:#707965}.placeholder{height:100px;display:flex;align-items:center;justify-content:center;background:#e6e9de;color:#8b947e;font-size:20px}footer{display:flex;justify-content:space-between;margin-top:16px;font-size:12px;color:#808573}.tablet main{max-width:1024px}.tablet .regions{grid-template-columns:repeat(2,1fr)}.tablet .detail-grid{grid-template-columns:repeat(6,1fr)}.tablet .cover img{height:100px}@media(max-width:800px){header{padding:18px;height:auto;gap:12px;flex-wrap:wrap}main{padding:20px}.regions{grid-template-columns:repeat(2,1fr)}.toolbar{flex-wrap:wrap}.detail-grid{grid-template-columns:repeat(4,1fr)}.heading{align-items:start;gap:12px}.badge{font-size:10px}}
/* Review refinement: covers lead, aggregation remains a quiet secondary action. */
body{background:#f4f3ee;color:#293a35}header{background:#fffef9;border-color:#e1e5dc}.badge{background:#e8eee5;color:#315a48;border-radius:6px}small,.sub,.summary,footer{color:#718078}.summary b{color:#315a48}button:focus-visible{outline-color:#315a48}button.control{background:#fffef9;border-color:#e1e5dc;border-radius:4px}.control.active{background:#315a48;border-color:#315a48}.canvas{background-color:#f0f1e9;background-image:radial-gradient(#a6b2a13b 1px,transparent 1px);border-color:#e1e5dc;border-radius:6px}.regions{gap:24px}.region{padding:0;background:transparent;border:0;border-radius:0;box-shadow:none}.region h3{font-size:12px;color:#718078;margin:0 0 10px;letter-spacing:.4px}.cover{border:1px solid #e1e5dc;border-radius:4px;box-shadow:0 3px 10px #24342b0a}.cover img{height:220px}.cover span{padding:14px 13px 15px;background:#fffef9}.cover b{font-size:16px;font-weight:500}.cover small{font-size:11px;margin-top:5px}.clusters{display:flex;flex-direction:column;gap:0;margin-top:12px;padding:0 3px}.cluster{display:flex;align-items:center;justify-content:space-between;gap:4px;border:0;border-radius:3px;padding:7px 0;background:transparent;color:#718078;text-align:left}.cluster:hover{transform:none;background:#e8eee580;color:#315a48}.cluster strong{display:inline;font-size:12px;font-weight:400}.cluster span{display:inline;font-size:11px;color:inherit}.cluster .cell-label{flex:1}.legend{border-top:1px solid #e1e5dc;padding-top:16px;margin-top:26px;color:#718078;font-size:11px}.canvas-head{color:#718078}.tablet .cover img{height:180px}@media(max-width:800px){.cover img{height:160px}.regions{gap:18px}.cluster{flex-wrap:wrap}}
</style>
<header><div><h1>拾途</h1><small>自由画布 / 总览交互提案</small></div><span class="badge">500张合成数据 · 交互样例，尚未接入产品</span></header>
<main><div class="heading"><div><h2 id="title">把远处的回忆，先看成一片风景</h2><p class="sub" id="subtitle">先看旅行与区块封面，再进入一簇照片。每一张回忆都留在画布模型中。</p></div><small id="zoom-label">总览 · 25%</small></div>
<div class="toolbar"><button class="control active" id="overview">总览 25%</button><button class="control" id="detail">局部 100%</button><span class="spacer"></span><button class="control" id="select">全选 500 张</button><button class="control" id="clear">清空选择</button><button class="control" id="device">切换平板预算 24</button></div>
<div class="summary" aria-live="polite"><span>完整模型 <b>500</b> 张</span><span>已选择 <b id="selected">0</b> 张</span><span>当前节点 <b id="nodes">0</b></span><span>图片元素 <b id="images">0</b> / <span id="budget">48</span></span></div>
<section class="canvas" aria-label="画布交互样例"><div class="canvas-head"><span id="crumb">全部回忆 / 4 个旅行与区块</span><span id="hint">点击封面或聚合格 · Enter 同样可进入</span></div><div id="content"></div><div class="legend" id="legend"><span>▣ 优先显示旅行 / 区块封面</span><span>▧ 散落照片按屏幕网格聚合</span><span>↗ 进入局部后选择单张照片</span></div></section>
<footer><span>仅供评审：固定合成位置与演示图片，不含个人数据。</span><span>模型选择独立保存 · 返回总览保留选择</span></footer></main>
<script>
const assets=['west-lake','wuzhen','jiuzhaigou','emei','palace','great-wall','shanghai','huanglong'];
const names=['江南慢行','山野来信','旧城散步','日常拾光'];
// 500 deterministic records; screen cells aggregate loose photos without creating their image elements.
const model=Array.from({length:500},(_,id)=>({id,region:Math.floor(id/125),x:(id*73)%1000,y:(id*137)%720,src:'../../public/journal-demo/'+assets[id%assets.length]+'.jpg'}));
const selected=new Set();let mode='overview',region=0,cell=null,tablet=false,lastTrigger=null;
const $=id=>document.getElementById(id);
function enter(r,c=null,trigger=null){region=r;cell=c;mode='detail';lastTrigger=trigger;render();$('overview').focus()}
function render(){let items=model.filter(p=>p.region===region);if(cell!==null)items=items.filter(p=>Math.floor(p.x/500)===cell);const budget=tablet?24:48;
 $('content').replaceChildren();$('selected').textContent=selected.size;$('budget').textContent=budget;$('overview').classList.toggle('active',mode==='overview');$('detail').classList.toggle('active',mode==='detail');$('zoom-label').textContent=mode==='overview'?'总览 · 25%':'局部 · 100%';$('crumb').textContent=mode==='overview'?'全部回忆 / 4 个旅行与区块':names[region]+' / '+(cell===null?'封面附近':`散落照片 · 网格 ${cell+1}`);$('hint').textContent=mode==='overview'?'点击封面或聚合格 · Enter 同样可进入':'点击单张切换选择 · 返回总览保留选择';
 if(mode==='overview'){const grid=document.createElement('div');grid.className='regions';names.forEach((name,r)=>{const node=document.createElement('article');node.className='region';node.innerHTML=`<h3>0${r+1} / ${name}</h3><button class="cover" data-key="cover-${r}"><img src="${model[r*125].src}" alt="${name}演示封面"><span><b>${r<2?'旅行':'区块'} · ${name}</b><small>125 张照片 · 进入局部 ↗</small></span></button><div class="clusters"></div>`;node.querySelector('.cover').onclick=e=>enter(r,null,e.currentTarget.dataset.key);for(let c=0;c<2;c++){const count=model.filter(p=>p.region===r&&Math.floor(p.x/500)===c).length;const b=document.createElement('button');b.className='cluster';b.dataset.key=`cell-${r}-${c}`;b.innerHTML=`<span class="cell-label">网格 ${c+1} · 散落 <strong>${count}</strong> 张</span><span>进入局部 ↗</span>`;b.onclick=()=>enter(r,c,b.dataset.key);node.querySelector('.clusters').append(b)}grid.append(node)});$('content').append(grid)
 }else{const grid=document.createElement('div');grid.className='detail-grid';items.slice(0,120).forEach((p,i)=>{const b=document.createElement('button');b.className='photo';b.setAttribute('aria-pressed',selected.has(p.id));b.setAttribute('aria-label',`照片 ${p.id+1}`);b.innerHTML=(i<budget?`<img src="${p.src}" alt="合成记录 ${p.id+1} 的演示图片">`:'<div class="placeholder" aria-hidden="true">▧</div>')+`<span>${selected.has(p.id)?'✓ 已选':'照片'} · ${String(p.id+1).padStart(3,'0')}</span>`;b.onclick=()=>{selected.has(p.id)?selected.delete(p.id):selected.add(p.id);render();document.querySelector(`[aria-label="照片 ${p.id+1}"]`).focus()};grid.append(b)});$('content').append(grid);$('hint').textContent+=` · 显示 ${Math.min(items.length,120)} / ${items.length} 个节点`}
 $('images').textContent=document.querySelectorAll('img').length;$('nodes').textContent=mode==='overview'?12:Math.min(items.length,120);document.body.classList.toggle('tablet',tablet);$('device').textContent=tablet?'切换桌面预算 48':'切换平板预算 24';}
 $('overview').onclick=()=>{mode='overview';render();if(lastTrigger)document.querySelector(`[data-key="${lastTrigger}"]`)?.focus()};$('detail').onclick=()=>enter(region);$('select').onclick=()=>{model.forEach(p=>selected.add(p.id));render()};$('clear').onclick=()=>{selected.clear();render()};$('device').onclick=()=>{tablet=!tablet;render()};render();
</script></html>
